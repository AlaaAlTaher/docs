.slide-title{font-size:clamp(26px,3vw,48px);font-weight:900;line-height:1.45;margin:0 0 5px}.slide-sub{color:var(--muted);font-size:clamp(14px,1.38vw,20px);line-height:1.7;margin:0 0 13px}.deck-content{display:flex;flex:1;min-height:0;flex-direction:column;align-items:center;justify-content:center;gap:12px}.twocol{display:grid;grid-template-columns:1fr 1.13fr;gap:21px;width:100%;align-items:stretch;max-height:100%}.twocol.diagramleft{grid-template-columns:1fr 1.32fr}.card{background:#fbfdff;border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;justify-content:center;flex-direction:column;gap:16px;min-height:0}.card .h{font-size:clamp(20px,2vw,30px);font-weight:850}.card .body{font-size:clamp(16px,1.58vw,24px);line-height:1.9}.card.center{text-align:center;align-items:center}.card.diagram{background:#f7fbfd}.diagram svg{width:100%;height:100%;min-height:210px;max-height:480px;overflow:visible}.answer{border-radius:18px;background:#def6ed;color:var(--ink);padding:16px 23px;font-size:clamp(18px,1.9vw,27px);font-weight:800;text-align:center;line-height:1.65}.accent{color:var(--blue)}.orange{color:var(--red)}.muted{color:var(--muted)}.formula{font-family:Arial,Tahoma,sans-serif;direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:900;color:var(--ink)}.small{font-size:clamp(14px,1.2vw,18px)}.tag{display:inline-block;background:#e5f6f3;color:#216e72;border-radius:40px;padding:9px 18px;font-weight:750;width:max-content;max-width:100%;font-size:clamp(14px,1.2vw,20px)}.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;width:100%}.step{background:#f7fafc;padding:20px;border-radius:19px;border-right:8px solid var(--teal);font-size:clamp(18px,1.8vw,28px);font-weight:bold;line-height:1.7}.step:nth-child(2){border-color:var(--blue)}.step:nth-child(3){border-color:var(--purple)}.step:nth-child(4){border-color:var(--red)}.step small{display:block;font-size:.62em;color:var(--muted);font-weight:normal}.items{display:flex;flex-direction:column;gap:14px}.item{font-size:clamp(17px,1.65vw,26px);background:#f1f7fc;border-radius:12px;padding:14px 19px;line-height:1.6}.item strong{color:var(--blue)}.table{width:100%;border-collapse:separate;border-spacing:0 10px;font-size:clamp(15px,1.6vw,25px)}.table td{padding:13px 15px;background:#f3f7fb}.table tr td:first-child{border-radius:0 12px 12px 0;border-right:7px solid var(--teal);font-weight:bold}.table tr:nth-child(2) td:first-child{border-color:var(--blue)}.table tr:nth-child(3) td:first-child{border-color:var(--purple)}.table tr:nth-child(4) td:first-child{border-color:var(--red)}.table tr td:last-child{border-radius:12px 0 0 12px;color:var(--muted)}.bigformula{direction:ltr;unicode-bidi:isolate;font:bold clamp(29px,3vw,49px) Arial,sans-serif;color:var(--ink);text-align:center;white-space:nowrap}.quiz-choice{display:flex;justify-content:center;align-items:center;min-height:64px;border:2px solid #d6e5ed;background:#f0f8fc;color:var(--ink);font-size:clamp(19px,2vw,30px);font-weight:bold;border-radius:15px;transition:.2s}.quiz-choice:hover:not(:disabled){transform:translateY(-3px);border-color:var(--teal);background:#e5fbf6}.quiz-choice:disabled{cursor:default}.quiz-choice.correct{background:#e1f8ec;border-color:var(--ok);color:#146e4e}.quiz-choice.wrong{background:#ffe5e6;border-color:var(--bad);color:#983539}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.feedback{margin-top:16px;font-size:clamp(16px,1.6vw,23px);padding:13px 17px;border-radius:12px;line-height:1.7}.feedback.good{background:#e5f8ed;color:#176d4a}.feedback.try{background:#fff1e8;color:#8e4a30}.button{border:0;background:var(--teal);color:white;font-size:clamp(16px,1.5vw,23px);font-weight:800;padding:13px 28px;border-radius:14px;box-shadow:0 7px 20px rgba(7,159,153,.13);transition:.16s}.button:hover{filter:brightness(.93);transform:translateY(-1px)}.button.dark{background:var(--ink)}.button.gold{background:var(--gold);color:var(--ink)}.reveal-holder{display:flex;flex-direction:column;align-items:center;gap:12px;min-height:104px}.reveal-text{display:none}.reveal-text.show{display:block;animation:slidein .4s both}.slide-actions{display:flex;justify-content:center;padding:12px}.footer{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 30px 9px;direction:ltr}.nav{display:flex;align-items:center;gap:10px;direction:rtl}.nav button{border:0;border-radius:11px;background:var(--ink);padding:10px 19px;color:#fff;font-size:15px;font-weight:800}.nav button.next{background:var(--teal)}.nav button:disabled{opacity:.34;cursor:default}.status{font-size:13px;color:var(--muted)}.progress{height:5px;background:#e1eaf3;position:absolute;bottom:0;left:0;right:0}.progress>div{height:100%;background:var(--teal);transition:width .5s}.animate-draw{stroke-dasharray:1300;stroke-dashoffset:1300;animation:draw 1.3s ease .25s forwards}@keyframes draw{to{stroke-dashoffset:0}}.angle-highlight{animation:pulse .65s ease-out .35s both;transform-origin:center;transform-box:fill-box}@keyframes pulse{0%{opacity:0;transform:scale(.4)}75%{opacity:1;transform:scale(1.17)}100%{opacity:1;transform:scale(1)}}.seq>*{animation:slidein .45s both}.seq>*:nth-child(2){animation-delay:.18s}.seq>*:nth-child(3){animation-delay:.36s}.seq>*:nth-child(4){animation-delay:.54s}.seq>*:nth-child(5){animation-delay:.72s}.fence{width:100%;height:auto;max-height:330px}.max{max-width:1080px;width:100%;margin:auto}.graphic{width:100%;height:auto}.cover{background:linear-gradient(135deg,#172e49 0%,#244962 100%);color:#fff;align-items:center;text-align:center;justify-content:center;gap:30px}.cover .slide-title{font-size:clamp(38px,5.5vw,80px)}.cover .slide-sub{color:#d2e6f1;font-size:clamp(20px,2vw,31px)}.cover-bubbles{display:flex;gap:25px;align-items:center;justify-content:center}.cover-bubbles span{display:block;width:28px;height:28px;border-radius:100%;background:var(--gold)}.cover-bubbles span:nth-child(2){width:17px;height:17px;background:var(--teal)}.cover-bubbles span:nth-child(3){width:12px;height:12px;background:#ffaf88}.quizbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}.quiz-count{color:var(--blue);font-weight:bold;font-size:20px}.score{background:#e6f7f1;color:#17765b;padding:10px 17px;border-radius:30px;font-weight:800}.star{font-size:65px;color:var(--gold);text-shadow:1px 3px #e4a840}.page-source{color:#8292a4;font-size:12px;position:absolute;bottom:10px;right:34px}.quiz-question-title{font-size:clamp(20px,2.2vw,33px);font-weight:800;margin:0 0 11px}.letters{color:var(--blue)}

 const standard={1:[231,101],2:[305,101],3:[305,184],4:[231,184],5:[296,265],6:[370,265],7:[370,349],8:[296,349]};

 const dict=map==='book'?book:standard;
 let out=`<svg viewBox="0 0 610 400" role="img" aria-label="مستقيمان متوازيان وقاطع وزوايا مرقمة"><rect x="5" y="5" width="600" height="390" rx="22" fill="#f8fcff"/>`;
 out+=`<path d="M50 142 H555 M50 307 H555" stroke="#2688b8" stroke-width="6" fill="none" stroke-linecap="round" class="animate-draw"/>`;

 for(const [n,p] of Object.entries(dict)){
   const val=String(values[n]??n),hi=marks.includes(Number(n));
   if(hi)out+=`<circle class="angle-highlight" cx="${p[0]}" cy="${p[1]}" r="28" fill="#f4ca62" opacity=".94"/>`;

 } return out+'</svg>';
};

const fence=()=>{let a='<svg class="fence" viewBox="0 0 670 290" role="img" aria-label="أعمدة سياج متوازية"><rect x="16" y="73" width="640" height="28" rx="5" fill="#b38761"/><rect x="16" y="184" width="640" height="28" rx="5" fill="#b38761"/>';for(let i=0;i<8;i++){let xx=30+i*84;a+=`<rect x="${xx}" y="17" width="29" height="251" rx="7" fill="#7e5c44"/><path d="M ${xx+6} 30 L ${xx+6} 254" stroke="#b38b6b" stroke-width="5"/>`;}return a+'</svg>';};

const sections=[
{title:'المستقيمات المتوازية والقاطع',phase:'الوحدة الرابعة • الدرس الثاني',page:'ص 96–100',cover:true,sub:'درس متدرّج مع رسوم متحركة وأمثلة من الكتاب ولعبة تفاعلية',html:`<div class="cover-bubbles"><span></span><span></span><span></span></div><button class="button gold" onclick="nextSlide()">ابدأ الدرس</button>`},
{title:'خريطة الدرس',phase:'التهيئة',page:'ص 96–100',sub:'نتعلم بتدرج الكتاب نفسه.',html:`<div class="steps max seq"><div class="step">1. أستكشف<small>السياج: ماذا يعني التوازي؟</small></div><div class="step">2. أتعلّم<small>المستويات ومتوازي المستطيلات</small></div><div class="step">3. أفهم<small>القاطع وأزواج الزوايا الأربع</small></div><div class="step">4. أطبّق<small>قواعد القياس ثم لعبة التحدّي</small></div></div>`},
{title:'أستكشف: سياج رحمة',phase:'أستكشف',page:'ص 96',sub:'صنعت رحمة نموذج سياج باستخدام أعواد المثلجات.',html:cards('<div class="h accent">سؤال التفكير</div><div class="body">كيف أتحقق من أن الأعمدة الرأسية في السياج متوازية؟</div><span class="tag">راقب الاتجاه وعدم التقاطع</span>',fence())},
{title:'ما الذي اكتشفناه؟',phase:'أستكشف',page:'ص 96',sub:'نفس الاتجاه، وعدم التقاطع، هما مفتاح التوازي.',html:cards('<div class="items seq"><div class="item">1. الأعمدة تسير في الاتجاه نفسه.</div><div class="item">2. إذا مددناها فلن تتقاطع.</div></div>',fence())+`<div class="slide-actions"><div class="reveal-holder"><button class="button" onclick="reveal(this)">أظهر الاستنتاج</button><div class="reveal-text">${note('الأعمدة الرأسية في السياج مستقيمات متوازية.')}</div></div></div>`},
{title:'أهداف الدرس',phase:'فكرة الدرس',page:'ص 96',sub:'تعرّف العلاقات بين الزوايا الناتجة من تقاطع مستقيم مع مستقيمين متوازيين.',html:`<div class="steps max seq"><div class="step">أميّز المستقيمات المتوازية.</div><div class="step">أعرّف المستوى والقاطع.</div><div class="step">أميّز الزوايا المتناظرة والمتبادلة.</div><div class="step">أوجد قياسات الزوايا المجهولة.</div></div>`},

{title:'إذا كان المستقيمان متوازيين',phase:'القواعد',page:'ص 98',sub:'قياس زاوية واحدة يكفي لتحديد قياسات الزوايا السبع الأخرى.',html:`<div class="max"><table class="table"><tr><td>الزاويتان المتناظرتان</td><td>متساويتان</td></tr><tr><td>الزاويتان المتبادلتان داخليًا</td><td>متساويتان</td></tr><tr><td>الزاويتان المتبادلتان خارجيًا</td><td>متساويتان</td></tr><tr><td>الزاويتان الداخليتان في جهة واحدة</td><td>مجموعهما 180°</td></tr></table></div>`},

{title:'تمرين 12–17: الزاوية 60°',phase:'أتدرّب',page:'ص 100',sub:'إذا كانت ∠5 = 60° في الشكل المرقّم هنا، فحدّد الزوايا الأخرى.',html:cards(`<div class="body">كل زاوية إما 60° أو 120°.</div><div class="reveal-holder"><button class="button" onclick="reveal(this)">أظهر الحل</button><div class="reveal-text">${note('∠1 و∠3 و∠5 و∠7 = 60°، والزوايا الباقية = 120°.')}</div></div>`,draw('std',[5],{5:'60°'}))},

{title:'تمرين 19: أوجد x',phase:'أتدرّب',page:'ص 100',sub:'زاوية خارجية 116° وزاوية رأس 51°.',html:cards(`<div class="body">الزاوية اليسرى = ${F('180° − 116° = 64°')}</div><div class="body">مجموع زوايا المثلث = 180°</div><div class="bigformula">x = 180 - 51 - 64 = 65°</div>`,triangle())},
{title:'تمارين المنشور الخماسي',phase:'أراجع',page:'ص 99',sub:'حدّد الحواف والأوجه المتوازية بنفسك.',html:cards(`<div class="items"><div class="item">قطعة توازي AB؟</div><div class="item">مستويان متوازيان؟</div><div class="item">قطعتان توازيان المستوى AEJF؟</div></div><div class="reveal-holder"><button class="button" onclick="reveal(this)">أظهر الإجابات</button><div class="reveal-text">${note('FG  |  ABCDE و FGHIJ  |  CH و DI')}</div></div>`,pentagon())},
{title:'أفكّر وأكتب',phase:'مهارات التفكير العليا',page:'ص 100',sub:'تطبيق أخير قبل التحدّي.',html:`<div class="items max seq"><div class="item"><strong>متى تتساوى الزوايا الثماني؟</strong><br>إذا كان القاطع عموديًا على المستقيمين، فكل زاوية = 90°.</div><div class="item"><strong>كم مجموع قياسات الزوايا الثماني؟</strong><br>${F('360° + 360° = 720°')} لأن الزوايا حول كل نقطة تقاطع مجموعها 360°.</div></div>`},
{title:'تحدّي الزوايا',phase:'اللعبة التفاعلية',page:'5 أسئلة',sub:'اختيار من متعدد مع تصحيح فوري ونتيجة نهائية.',html:`<div class="card center max seq" style="padding:35px"><div class="star">★ ★ ★ ★ ★</div><div class="h">هل أنت مستعد للتحدّي؟</div><div class="body muted">أجب عن خمسة أسئلة. يمكنك إعادة المحاولة عند الخطأ.</div><button class="button" onclick="startQuiz()">ابدأ اللعبة</button></div>`},
{title:'لعبة الزوايا',phase:'اللعبة',page:'5 أسئلة',sub:'اضغط على إجابتك، وسينتقل التحدّي تلقائيًا للسؤال التالي بعد التصحيح.',game:true,html:''},
{title:'أنهيت الدرس بنجاح!',phase:'الخاتمة',page:'الصفحات 96–100',sub:'تذكّر: ثلاث علاقات متساوية، وعلاقة واحدة مجموعها 180°.',html:`<div class="card center max" style="padding:38px;gap:30px"><div class="star">★</div><div class="h">ممتاز! مهاراتك في تصنيف الزوايا أصبحت أقوى.</div><div class="body">هل تريد اختبار نفسك مرة أخرى؟</div><button class="button" onclick="startQuiz()">إعادة اللعبة</button><button class="button dark" onclick="goTo(1)">العودة إلى خارطة الدرس</button></div>`}
];
const gameQs=[
 {question:'ما الزاوية المتناظرة مع ∠2؟',choices:['∠5','∠6','∠7','∠8'],correct:1,note:'∠2 و∠6 لهما الموضع نفسه.',highlight:[2],pair:[2,6]},
 {question:'ما الزاوية المتبادلة داخليًا مع ∠4؟',choices:['∠5','∠6','∠7','∠8'],correct:1,note:'∠4 و∠6 داخل المستقيمين وعلى جهتين مختلفتين.',highlight:[4],pair:[4,6]},
 {question:'إذا كان قياس ∠4 = 115°، فكم قياس ∠5؟',choices:['115°','90°','65°','75°'],correct:2,note:'الزاويتان داخليتان في جهة واحدة؛ 180 − 115 = 65.',highlight:[4,5],pair:[4,5]},
 {question:'إذا كان قياس ∠1 = 60°، فكم قياس ∠4؟',choices:['60°','120°','90°','30°'],correct:1,note:'الزاويتان 1 و4 على استقامة واحدة؛ 180 − 60 = 120.',highlight:[1],pair:[1,4]},
 {question:'في مثلث زاويتاه 51° و64°؛ كم قياس الثالثة؟',choices:['65°','75°','116°','51°'],correct:0,note:'مجموع الزوايا 180؛ الباقي 180 − 51 − 64 = 65.',highlight:[],pair:[]}
];
let index=0,qIndex=0,score=0,firstTry=true,chosen=null,solved=false;
function render(){const s=sections[index],stage=document.querySelector('#stage');const isCover=!!s.cover;
 stage.innerHTML=`<section class="slide ${isCover?'cover':''}" id="slide" aria-label="الشريحة ${index+1}"><div class="slide-title">${s.title}</div><p class="slide-sub">${s.sub||''}</p><div class="deck-content">${s.game?renderGame():s.html}</div>${isCover?`<div class="slide-title" style="display:none">${s.title}</div>`:`<span class="page-source">${s.page||''}</span>`}</section>`;
 document.querySelector('#chapter').textContent=`${s.phase||'الدرس الثاني'}`;document.querySelector('#counter').textContent=`${index+1} / ${sections.length}`;document.querySelector('#bar').style.width=((index+1)/sections.length*100)+'%';
 document.querySelector('#prev').disabled=index===0;document.querySelector('#next').disabled=index===sections.length-1||s.game;
 if(s.game) attachGameHandlers();
}
function goTo(i){index=Math.max(0,Math.min(sections.length-1,i));render()}
function nextSlide(){if(sections[index].game)return;goTo(index+1)}
function prevSlide(){goTo(index-1)}
function toggleFullScreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function reveal(el){const wrap=el.closest('.reveal-holder');wrap.querySelector('.reveal-text').classList.add('show');el.remove()}
function startQuiz(){score=0;qIndex=0;firstTry=true;chosen=null;solved=false;goTo(sections.findIndex(s=>s.game))}
function renderGame(){const q=gameQs[qIndex],pic=qIndex===4?triangle():draw('std',solved?q.pair:q.highlight,qIndex===3?{1:'60°'}:qIndex===2?{4:'115°'}:{});return `<div style="width:100%;min-height:0"><div class="quizbar"><div class="quiz-count">السؤال ${qIndex+1} من ${gameQs.length}</div><div class="score">النقاط: ${score} / ${gameQs.length}</div></div><div class="quiz-question-title">${q.question}</div><div class="twocol diagramleft"><div class="card"><div class="choices">${q.choices.map((c,i)=>`<button class="quiz-choice ${solved&&i===q.correct?'correct':chosen===i?'wrong':''}" data-choice="${i}" ${solved?'disabled':''}>${['أ','ب','ج','د'][i]} — ${c}</button>`).join('')}</div>${chosen!==null?`<div class="feedback ${solved?'good':'try'}">${solved?'✓ ممتاز! '+q.note:'ليست الإجابة الصحيحة. راجع العلاقة ثم جرّب اختيارًا آخر.'}</div>`:''}${solved?`<button class="button" id="game-next">${qIndex===4?'شاهد النتيجة':'السؤال التالي'}</button>`:''}</div><div class="card diagram">${pic}</div></div></div>`}
function attachGameHandlers(){document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{const k=Number(b.dataset.choice),q=gameQs[qIndex];if(solved)return;chosen=k;if(k===q.correct){solved=true;if(firstTry)score++}else{firstTry=false}render()}));const b=document.querySelector('#game-next');if(b)b.addEventListener('click',()=>{if(qIndex===gameQs.length-1){showGameResult()}else{qIndex++;firstTry=true;chosen=null;solved=false;render()}})}
function showGameResult(){let stage=document.querySelector('#stage');stage.innerHTML=`<section class="slide"><div class="slide-title">نتيجة تحدّي الزوايا</div><div class="deck-content"><div class="card center max seq" style="padding:40px"><div class="star">★</div><div class="h">أكملت الأسئلة الخمسة!</div><div class="bigformula">${score} / 5</div><div class="body">${score===5?'ممتاز! أجبت عن جميع الأسئلة صحيحة من أول محاولة.':score>=3?'أحسنت! واصل التدريب لتتقن كل الأنواع.':'حاول مرة أخرى؛ راجع القواعد الأربع أولًا.'}</div><button class="button" onclick="startQuiz()">إعادة التحدّي</button><button class="button dark" onclick="goTo(${sections.length-1})">العودة إلى نهاية الدرس</button></div></div></section>`;
 document.querySelector('#chapter').textContent='نتيجة اللعبة';document.querySelector('#next').disabled=true;
}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&!sections[index].game)prevSlide();if(e.key==='ArrowLeft'&&!sections[index].game)nextSlide();});render();
</script></body></html>
